networks:
  timerbot:
    driver: bridge

volumes:
  logs:

services:
  timerbot:
    build: .
    restart: always
    environment:
      - REDIS_HOST=redis
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - logs:/app/logs
    depends_on:
      - redis
    networks:
      - timerbot
  redis:
    image: redis/redis-stack
    restart: always
    ports:
      - "${REDIS_EXPOSED_PORT:-6379}:6379"
    networks:
      - timerbot
